name: Update YouTube data
on:
  schedule:
    - cron: "0 */6 * * *"   # tiap 6 jam
  workflow_dispatch:         # bisa dijalankan manual dari tab Actions
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch YouTube data
        run: node scripts/update-youtube.mjs
        env:
          YOUTUBE_API_KEY: ${{ AIzaSyB-0D8kxwp4OUtDVxCOZdrzk1VZpHebh_g }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/youtube.json
          git diff --staged --quiet || (git commit -m "chore: update YouTube data" && git push)
