<script>
/* ===== CONFIG (halaman Product) ===== */
const CONFIG = {

const { t, LANG, esc, src, slugify, fmtDate, catLabel, waLink, loadProducts, groupByCategory, card, mountGallery, toast, priceMarkup, checkoutHref, lemonCheckoutHref, shareHref } = ZLP;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
let ALL = [], loaded = false, SHARE = null;
const F = { cat: 'all', tag: '', q: '' };
const baseTitle = document.title, baseDesc = $('#metaDesc').content;
/* SVG vektor brand asli, bukan ikon generik Lucide. */
const WA_BRAND_ICON = `<svg viewBox="0 0 24 24" aria-hidden="true" class="w-5 h-5 shrink-0" xmlns="http://www.w3.org/2000/svg"><path fill="#25D366" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.966-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.198-.347.223-.644.075-.297-.149-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.496.099-.198.05-.372-.025-.52-.075-.149-.67-1.612-.916-2.206-.242-.579-.487-.5-.669-.51-.173-.008-.372-.01-.57-.01-.198 0-.52.074-.793.372s-1.04 1.017-1.04 2.48 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.077 4.487.709.306 1.262.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.29.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.9 9.9 0 01-5.031-1.378l-.361-.214-3.74.982.998-3.646-.235-.374a9.894 9.894 0 01-1.518-5.274c.002-5.458 4.444-9.9 9.905-9.9 2.644 0 5.128 1.03 6.993 2.898a9.849 9.849 0 012.9 7.005c-.003 5.459-4.445 9.901-9.907 9.901m8.423-18.324A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335 .157 11.893c0 2.096.547 4.143 1.588 5.949L.057 24l6.3-1.652a11.87 11.87 0 005.684 1.448h.005c6.557 0 11.893-5.335 11.896-11.893a11.815 11.815 0 00-3.488-8.442"/></svg>`;

/* i18n untuk teks antarmuka */
function applyStatic() {
  document.documentElement.lang = LANG; $('#langLabel').textContent = LANG.toUpperCase();
  $$('[data-i]').forEach(el => { const [a, b] = el.dataset.i.split('|'); el.textContent = LANG === 'id' ? a : b; });
  $$('[data-ph]').forEach(el => { const [a, b] = el.dataset.ph.split('|'); el.placeholder = LANG === 'id' ? a : b; });
}
$('#langBtn').addEventListener('click', () => { try { localStorage.setItem('zl_lang', LANG === 'id' ? 'en' : 'id'); } catch (e) {} location.reload(); });
$('#menuBtn').addEventListener('click', () => { const m = $('#mobileMenu'); m.style.display = m.style.display === 'none' ? 'grid' : 'none'; });

/* WhatsApp */
['#ctaWa', '#ctaWaM'].forEach(s => { const a = $(s); if (CONFIG.whatsappUrl) { a.href = CONFIG.whatsappUrl; a.target = '_blank'; a.rel = 'noopener noreferrer'; } else a.href = '/#contact'; });

/* ===== Filter & render ===== */
function matches(p) {
  if (F.cat !== 'all' && (p.category || '') !== F.cat) return false;
  if (F.tag && !p.tags.some(x => x.toLowerCase() === F.tag.toLowerCase())) return false;
  if (F.q) { const q = F.q.toLowerCase(); if (!(p.title + ' ' + p.category + ' ' + p.tags.join(' ') + ' ' + p.description).toLowerCase().includes(q)) return false; }
  return true;
}
const href = p => location.pathname + '?p=' + encodeURIComponent(p.slug);

function renderChips() {
  const counts = new Map(); ALL.forEach(p => counts.set(p.category || '', (counts.get(p.category || '') || 0) + 1));
  const cats = [...counts.keys()].sort((a, b) => (a === '' ? 1 : b === '' ? -1 : a.localeCompare(b)));
  const chip = (k, label, n) => `<button data-cat="${esc(k)}" class="shrink-0 px-4 py-2 rounded-xl text-sm font-bold transition border ${F.cat === k ? 'bg-zura-navy text-white border-zura-navy shadow-md' : 'bg-white text-slate-700 border-slate-200 hover:border-blue-400'}">${esc(label)} <span class="${F.cat === k ? 'text-blue-200' : 'text-slate-400'} font-semibold">${n}</span></button>`;
  $('#catChips').innerHTML = ALL.length ? chip('all', t('Semua', 'All'), ALL.length) + cats.map(c => chip(c, catLabel(c), counts.get(c))).join('') : '';
  $('#activeTag').innerHTML = F.tag ? `<button data-cleartag class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg bg-blue-600 text-white text-xs font-bold">#${esc(F.tag)} <i data-lucide="x" class="w-3.5 h-3.5"></i></button>` : '';
}
function renderList() {
  const box = $('#list');
  if (!loaded) { box.innerHTML = `<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">${[0, 1, 2].map(() => '<div class="rounded-2xl overflow-hidden glass"><div class="aspect-square skel"></div><div class="p-4 space-y-2"><div class="h-4 w-3/4 rounded skel"></div><div class="h-3 w-1/2 rounded skel"></div></div></div>').join('')}</div>`; return; }
  if (!ALL.length) {
    box.innerHTML = `<div class="glass rounded-3xl p-10 sm:p-14 text-center max-w-2xl mx-auto">
      <div class="mx-auto w-14 h-14 rounded-2xl bg-zura-navy text-white grid place-items-center"><i data-lucide="package-open" class="w-7 h-7"></i></div>
      <h2 class="font-display mt-5 text-2xl font-extrabold text-zura-navy">${t('Produk segera hadir', 'Products coming soon')}</h2>
      <p class="mt-2 text-slate-600">${t('Sementara itu, ceritakan kebutuhanmu dan kita bahas aplikasi yang paling cocok.', 'Meanwhile, tell me what you need and we\'ll discuss the best-fit app.')}</p>
      <a href="${esc(CONFIG.whatsappUrl || '/#contact')}" target="_blank" rel="noopener" class="mt-6 inline-flex px-6 py-3 rounded-2xl bg-zura-navy hover:bg-blue-700 text-white font-bold transition">${t('Konsultasi gratis', 'Free consultation')}</a>
    </div>`; return;
  }
  const list = ALL.filter(matches);
  if (!list.length) {
    box.innerHTML = `<div class="glass rounded-3xl p-10 text-center max-w-xl mx-auto"><p class="font-bold text-zura-navy">${t('Tidak ada produk yang cocok.', 'No matching products.')}</p><button data-reset class="mt-4 px-5 py-2.5 rounded-xl bg-blue-600 text-white text-sm font-bold">${t('Reset filter', 'Reset filters')}</button></div>`; return;
  }
  const grouped = F.cat === 'all' && !F.q && !F.tag;
  let d = 0; const cardOf = p => card(p, { href: href(p), delay: Math.min(d++ * 50, 400) });
  if (grouped) {
    box.innerHTML = groupByCategory(list).map(([cat, items]) => `
      <section class="mb-10">
        <div class="flex items-center gap-3 mb-4"><h2 class="font-display text-xl font-extrabold text-zura-navy">${esc(catLabel(cat))}</h2><span class="text-xs font-bold bg-blue-50 text-blue-700 rounded-md px-2 py-0.5">${items.length}</span><div class="flex-1 h-px bg-blue-100"></div></div>
        <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">${items.map(cardOf).join('')}</div>
      </section>`).join('');
  } else {
    box.innerHTML = `<p class="text-sm font-semibold text-slate-500 mb-4">${list.length} ${t('produk ditemukan', 'products found')}</p><div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">${list.map(cardOf).join('')}</div>`;
  }
}
function render() { renderChips(); renderList(); lucide.createIcons(); }

  
/* ===== REGION CHECKOUT · modal reusable + analytics sesuai provider ===== */
let checkoutProduct = null, checkoutReturnFocus = null;
function priceSelected(p, region) {
  const usd = region === 'international';
  const normal = usd ? ZLP.parseUSDPrice(p.usdNormalPrice) : ZLP.parsePrice(p.normalPrice);
  const promo = usd ? ZLP.parseUSDPrice(p.usdPromoPrice) : ZLP.parsePrice(p.promoPrice);
  return normal !== null && promo !== null && promo < normal ? promo : normal;
}
function openCheckoutModal(p, trigger) {
  checkoutProduct = p; checkoutReturnFocus = trigger || document.activeElement;
  $('#checkoutProductName').textContent = p.title;
  const idr = priceSelected(p, 'indonesia'), usd = priceSelected(p, 'international');
  $('#checkoutIdrAmount').textContent = idr === null ? t('Harga belum diatur','Price not set') : ZLP.fmtPrice(idr);
  $('#checkoutUsdAmount').textContent = usd === null ? 'USD price not set' : ZLP.fmtUSD(usd);
  $('#checkoutNotice').classList.add('hidden'); $('#checkoutNotice').textContent = '';
  $('#checkoutSupport').classList.add('hidden');
  $('#checkoutModal').style.display = 'block';
  lucide.createIcons();
  $('#checkoutModal [data-region="indonesia"]').focus();
}
function closeCheckoutModal() {
  $('#checkoutModal').style.display = 'none'; checkoutProduct = null;
  if (checkoutReturnFocus && checkoutReturnFocus.isConnected) checkoutReturnFocus.focus();
  checkoutReturnFocus = null;
}
function checkoutNotice(message) {
  $('#checkoutNotice').textContent = message; $('#checkoutNotice').classList.remove('hidden');
  $('#checkoutSupport').href = CONFIG.whatsappUrl || '/gethelp/';
  $('#checkoutSupport').classList.remove('hidden');
}
function selectRegion(region) {
  const p = checkoutProduct; if (!p) return;
  const url = region === 'international' ? lemonCheckoutHref(p) : checkoutHref(p);
  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push({ event: 'select_payment_region', item_id: String(p.id), payment_region: region,
    payment_provider: region === 'international' ? 'lemon_squeezy' : 'mayar' });
  if (!url) {
    if (region === 'international') checkoutNotice('We’re sorry, this product is currently available for checkout in Indonesia only. Please contact Customer Service for more information or assistance.');
    else checkoutNotice(t('Maaf, pembayaran untuk Indonesia belum tersedia. Silakan hubungi Customer Service.',

/* ===== PRODUCT ANALYTICS ===== */
function trackProductView(p) {
  const normal = ZLP.parsePrice(p.normalPrice);
  const promo = ZLP.parsePrice(p.promoPrice);

  const price =
    normal !== null && promo !== null && promo < normal
      ? promo
      : normal;

  window.dataLayer = window.dataLayer || [];

  // Bersihkan ecommerce dari event sebelumnya
  window.dataLayer.push({ ecommerce: null });

  window.dataLayer.push({
    event: "view_item",
    ecommerce: {
      currency: "IDR",
      ...(price !== null ? { value: price } : {}),
      items: [{
        item_id: String(p.id),
        item_name: p.title,
        item_category: p.category,
        ...(price !== null ? { price: price } : {}),
        quantity: 1
      }]
    }
  });
}

  
/* ===== BEGIN CHECKOUT ANALYTICS ===== */
function trackBeginCheckout(p, region) {
  const price = priceSelected(p, region);
  const currency = region === 'international' ? 'USD' : 'IDR';
  const provider = region === 'international' ? 'lemon_squeezy' : 'mayar';
  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push({ ecommerce: null });
  window.dataLayer.push({
    event: 'begin_checkout', payment_region: region, payment_provider: provider,
    ecommerce: {
      currency, ...(price !== null ? { value: price } : {}),
      items: [{ item_id: String(p.id), item_name: p.title, item_category: p.category,
        ...(price !== null ? { price } : {}), quantity: 1 }]
    }
  });
}

/* ===== RENDER DETAIL PRODUK BERSTRUKTUR =====
   Kompatibel dengan field multiline di Catalog:
   - Baris judul tanpa awalan "-", diikuti satu/lebih baris "- ..." = kelompok fitur.
   - "- ..." = detail / bullet.
   - Baris kosong = pemisah yang tidak membuat item kosong.
   - "Judul | Deskripsi" (format lama) juga masih didukung.
   Selalu escape teks dari JSON untuk mencegah HTML injection.
*/
function structuredDetailMarkup(input) {
  const lines = String(input || '').replace(/\r\n?/g, '\n').split('\n').slice(0, 240);
  const blocks = [];
  let current = null;

  const makeBlock = (heading = '') => {
    current = { heading, entries: [] };
    blocks.push(current);
  };
  const parsePair = raw => {
    const pos = raw.indexOf('|');
    return pos > 0
      ? { label: raw.slice(0, pos).trim(), detail: raw.slice(pos + 1).trim() }
      : { label: '', detail: raw.trim() };
  };
  const isBullet = line => /^\s*(?:[-*•–—]\s+|\d{1,2}[.)]\s+)/u.test(line);
  const stripBullet = line => line.replace(/^\s*(?:[-*•–—]\s+|\d{1,2}[.)]\s+)/u, '').trim();
  const nextContent = index => {
    for (let j = index + 1; j < lines.length; j++) {
      if (lines[j].trim()) return lines[j].trim();
    }
    return '';
  };

  lines.forEach((raw, index) => {
    const line = raw.trim();
    if (!line) return;
    if (isBullet(line)) {
      if (!current) makeBlock();
      const text = stripBullet(line);
      if (text) current.entries.push({ type: 'bullet', ...parsePair(text) });
      return;
    }

    // Judul eksplisit "## ..." atau judul biasa yang diikuti baris detail berawalan "-".
    const markdownHeading = /^#{2,4}\s+(.+)$/u.exec(line);
    const isHeading = !!markdownHeading || isBullet(nextContent(index)) || (/[:：]$/u.test(line) && !line.includes('|'));
    if (isHeading) {
      const heading = (markdownHeading ? markdownHeading[1] : line).replace(/[:：]$/u, '').trim();
      makeBlock(heading);
      return;
    }

    // Format Catalog lama: "Judul | keterangan" tetap ditampilkan sebagai pasangan teks.
    // Kalimat biasa tidak dipaksakan menjadi judul fitur.
    if (!current || current.entries.some(e => e.type === 'bullet')) makeBlock();
    current.entries.push({ type: 'paragraph', ...parsePair(line) });
  });

  const content = entry => {
    if (entry.label) {
      return `<span class="font-bold text-zura-navy">${esc(entry.label)}</span>${entry.detail ? `<span class="text-slate-600"> — ${esc(entry.detail)}</span>` : ''}`;
    }
    return esc(entry.detail);
  };

  return blocks.map(block => {
    const bullets = block.entries.filter(e => e.type === 'bullet');
    const paragraphs = block.entries.filter(e => e.type === 'paragraph');
    const heading = block.heading
      ? `<h4 class="font-display text-[13px] sm:text-sm font-extrabold text-zura-navy leading-snug break-words">${esc(block.heading)}</h4>`
      : '';
    const paragraphsHTML = paragraphs.length
      ? `<div class="${heading ? 'mt-2' : ''} space-y-1.5">${paragraphs.map(e => `<p class="text-[13px] leading-relaxed text-slate-600 break-words">${content(e)}</p>`).join('')}</div>`
      : '';
    const bulletsHTML = bullets.length
      ? `<ul class="${heading || paragraphs.length ? 'mt-2.5' : ''} space-y-1.5" role="list">${bullets.map(e => `<li class="flex items-start gap-2 text-[13px] leading-relaxed text-slate-600 break-words"><span aria-hidden="true" class="shrink-0 text-slate-400 font-semibold leading-relaxed">–</span><span class="min-w-0">${content(e)}</span></li>`).join('')}</ul>`
      : '';
    return `<section class="py-3 first:pt-0 last:pb-0 border-b border-slate-100 last:border-b-0">${heading}${paragraphsHTML}${bulletsHTML}</section>`;
  }).join('');
}

/* ===== Bagikan: salin link / WhatsApp / Telegram ===== */
async function shareTo(kind) {
  const { title, description, url, cover } = SHARE;
  const text = `${title} — Zuralogic${description ? '\n' + description : ''}`;
  if (kind === 'wa') window.open('https://wa.me/?text=' + encodeURIComponent(text + '\n' + url), '_blank', 'noopener');
  else if (kind === 'tg') window.open('https://t.me/share/url?url=' + encodeURIComponent(url) + '&text=' + encodeURIComponent(text), '_blank', 'noopener');
  else if (kind === 'cover') {
    // Membagikan file asli ke aplikasi Status hanya bisa lewat Web Share API jika didukung.
    if (!cover) return toast(t('Cover produk tidak tersedia.', 'Product cover is unavailable.'));
    try {
      const response = await fetch(cover); if (!response.ok) throw new Error('cover download failed');
      const blob = await response.blob();
      const file = new File([blob], 'zuralogic-product-cover.' + (blob.type.includes('png') ? 'png' : blob.type.includes('jpeg') ? 'jpg' : 'webp'), { type: blob.type || 'image/webp' });
      if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title, text: text + '\n' + url }); return;
      }
      // Browser desktop: buka cover; pengguna bisa simpan dan unggah manual ke Status.
      window.open(cover, '_blank', 'noopener');
      toast(t('Buka/simpan gambar lalu unggah ke Status WhatsApp secara manual.', 'Save the cover and upload it to WhatsApp Status manually.'));
    } catch (e) { if (e.name !== 'AbortError') {
      window.open(cover, '_blank', 'noopener'); toast(t('Buka cover dan bagikan melalui aplikasi WhatsApp.', 'Open the cover and share it through WhatsApp.'));
    }}
  } else {
    const ok = () => toast(t('Link disalin', 'Link copied'));
    const fallback = () => { const ta = document.createElement('textarea'); ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); ok(); } catch (x) { toast(url); } ta.remove(); };
    if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function' && window.isSecureContext) navigator.clipboard.writeText(url).then(ok, fallback); else fallback();
  }
}
